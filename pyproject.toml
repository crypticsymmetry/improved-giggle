[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assumption-ops"
version = "0.1.0"
description = "Evidence-backed supplier exception planning with bounded ATMS reasoning and integer allocation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
assumption-ops = "assumption_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
