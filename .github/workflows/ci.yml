name: Test framework and Colab notebook
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,datasets]'
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: python scripts/validate_notebook.py
      - run: assumption-ops examples/sample_scenario.json --delay-supply shipment --available-day 8 > /tmp/demo.json
      - run: assumption-ops --supplies-csv examples/supplies.csv --orders-csv examples/orders.csv --policy-json examples/policy.json --delay-supply shipment --available-day 8 --compare examples/interventions.json --report-csv /tmp/interventions.csv > /tmp/comparison.json
      - run: python scripts/benchmark.py --orders 10 --repeats 1 > /tmp/benchmark.json
      - run: python scripts/replay_workflow.py > /tmp/workflow.json
      - run: assumption-ops-replay --orders 6 --seeds 1729 --output-dir /tmp/replay-results > /tmp/replay.json
      - run: assumption-ops-pilot --manifest examples/pilot/pilot.json --validate-only > /tmp/pilot-input.json
      - run: assumption-ops-pilot --manifest examples/pilot/pilot.json --config examples/pilot/calibration_config.json --output-dir /tmp/pilot-results > /tmp/pilot.json
      - run: assumption-ops-solvers --orders 10 --seeds 1729 --repeats 1 --output-dir /tmp/solver-results > /tmp/solvers.json
      - run: assumption-ops-business --manifest examples/business_pilot/manifest.json --validate-only > /tmp/business-input.json
      - run: assumption-ops-business --manifest examples/business_pilot/manifest.json --output-dir /tmp/business-results > /tmp/business.json
      - run: assumption-ops-business --init-dir /tmp/business-export-template > /tmp/business-template.json
      - run: assumption-ops-cluster --machines 2 --tasks 16 --cutoffs-us 900000000 --output-dir /tmp/cluster-results > /tmp/cluster.json
